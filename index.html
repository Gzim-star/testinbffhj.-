html, body {

.game {

canvas {

.title {

.title span:nth-child(3) { animation-delay: 0.1s; }
.title span:nth-child(4) { animation-delay: 1.0s; }
.title span:nth-child(6) { animation-delay: 1.1s; }
.title span:nth-child(7) { animation-delay: 0.3s; }
.title span:nth-child(8) { animation-delay: 1.2s; }

<script>

  // ===== GLOBAL PAUSE TIMER SYSTEM =====

const nativeSetTimeout = window.setTimeout.bind(window);
const nativeClearTimeout = window.clearTimeout.bind(window);

let managedTimers = new Map();
let managedTimerId = 1;
let timerSystemPaused = false;

function armManagedTimer(record, delay) {
  record.remaining = delay;
  record.startedAt = Date.now();

  record.nativeId = nativeSetTimeout(() => {

    record.nativeId = null;

    if (!managedTimers.has(record.id)) return;

    if (!record.interval) {
      managedTimers.delete(record.id);
      record.callback(...record.args);
      return;
    }

    record.callback(...record.args);

    if (!managedTimers.has(record.id)) return;

    if (timerSystemPaused) {
      record.remaining = record.delay;
      return;
    }

    armManagedTimer(record, record.delay);

  }, delay);
}

function createManagedTimer(callback, delay, interval, args) {
  const id = managedTimerId++;

  const record = {
    id,
    callback,
    delay: Math.max(0, Number(delay) || 0),
    remaining: Math.max(0, Number(delay) || 0),
    interval,
    args,
    nativeId: null,
    startedAt: 0
  };

  managedTimers.set(id, record);

  if (!timerSystemPaused) {
    armManagedTimer(record, record.delay);
  }

  return id;
}

window.setTimeout = function(callback, delay, ...args) {
  return createManagedTimer(callback, delay, false, args);
};

window.setInterval = function(callback, delay, ...args) {
  return createManagedTimer(callback, delay, true, args);
};

function clearManagedTimer(id) {
  const record = managedTimers.get(id);

  if (!record) return;

  if (record.nativeId !== null) {
    nativeClearTimeout(record.nativeId);
  }

  managedTimers.delete(id);
}

window.clearTimeout = clearManagedTimer;
window.clearInterval = clearManagedTimer;

function pauseManagedTimers() {

  if (timerSystemPaused) return;

  timerSystemPaused = true;

  const now = Date.now();

  managedTimers.forEach(record => {

    if (record.nativeId !== null) {
      nativeClearTimeout(record.nativeId);

      record.remaining = Math.max(
        0,
        record.remaining - (now - record.startedAt)
      );

      record.nativeId = null;
    }

  });
}

function resumeManagedTimers() {

  if (!timerSystemPaused) return;

  timerSystemPaused = false;

  managedTimers.forEach(record => {
    armManagedTimer(record, record.remaining);
  });
}

  try {
    if (!audioCtx) {
      audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    }

    if (audioCtx.state === "suspended") {
      audioCtx.resume().catch(error => {
        console.log("Audio konnte nicht gestartet werden:", error);
      });
    }
  } catch (error) {
    console.log("Audio-Fehler:", error);
  }
}

document.addEventListener('pointerdown', initAudio);
  
function playCorrectSound() {
  if (!audioCtx) return;

  if (audioCtx.state !== "running") {
    audioCtx.resume().then(() => {
      if (audioCtx.state === "running") {
        playCorrectSound();
      }
    }).catch(error => console.log("Audio:", error));

    return;
  }

  const now = audioCtx.currentTime;

  const osc = audioCtx.createOscillator();
  const gain = audioCtx.createGain();
  const filter = audioCtx.createBiquadFilter();

  osc.type = "triangle";

  // Kurzer digitaler BZZT//
  osc.frequency.setValueAtTime(620, now);
  osc.frequency.setValueAtTime(420, now + 0.025);
  osc.frequency.setValueAtTime(620, now + 0.055);
  osc.frequency.setValueAtTime(420, now + 0.085);

  filter.type = "highpass";
  filter.frequency.setValueAtTime(900, now);

  gain.gain.setValueAtTime(0.0001, now);
  gain.gain.exponentialRampToValueAtTime(0.04, now + 0.005);
  gain.gain.exponentialRampToValueAtTime(0.0001, now + 0.12);

  osc.connect(filter);
  filter.connect(gain);
  gain.connect(audioCtx.destination);

  osc.start(now);
  osc.stop(now + 0.13);
}

    choices[Math.floor(Math.random() * choices.length)];

      candidates = lengths.filter(length =>
        remaining[length] > 0 &&
        (position === 0 ||
         length !== runWordLengths[position - 1])
      );

    shuffleArray(candidates);

    for (const length of candidates) {
      if (remaining[length] <= 0) continue;

      if (position > 0 &&

      remaining[length]--;

      if (buildPlan(position + 1)) return true;

      remaining[length]++;

function getMaskedWord(word, round){

  if(round <= 1) return word;

  let letters = word.split('');
  let hideCount = Math.min(round - 1, letters.length - 2);

  let indexes = [];

  while(indexes.length < hideCount){
    let i = Math.floor(Math.random() * letters.length);
    if(!indexes.includes(i)){
      indexes.push(i);
    }
  }

  indexes.forEach(i=>{
    letters[i] = '_';
  });

  return letters.join('');
}

function getFakeWord(originalWord) {
  const len = originalWord.length;
  const candidates = WORDS.filter(w => w.length === len && w.toUpperCase() !== originalWord.toUpperCase());
  if(candidates.length === 0) return originalWord; // Fallback
  const index = Math.floor(Math.random() * candidates.length);
  return candidates[index].toUpperCase();
}

function generateFakeFrames() {
  fakeFrames = [];

  let fakeCount = getIllusionRound() === 3
    ? Math.max(2, round - 1)
    : round - 1;

  let availableColors = [...COLORS];

  for (let i = 0; i < fakeCount; i++) {
    let fx, fy;
    let valid = false;

    let attempts = 0;
    let maxAttempts = 200;

    while (!valid && attempts < maxAttempts) {
      attempts++;

      fx = Math.floor(Math.random() * arena[0].length);

      if (getIllusionRound() === 10) {
        fy = 5 + Math.floor(Math.random() * 6);
      } else {
        const minY = 5;
        const maxY = arena.length - frameH;
        fy = Math.floor(Math.random() * (maxY - minY)) + minY;
      }

      const overlapsOriginal =
        fx === frameX &&
        fy < frameY + frameH &&
        fy + frameH > frameY;

      const overlapsFake = fakeFrames.some(f =>
        f.x === fx &&
        fy < f.y + (f.h || frameH) &&
        fy + frameH > f.y
      );

      if (!overlapsOriginal && !overlapsFake) {
        valid = true;
      }
    }

    if (!valid) continue;

    let color = shuffledFrameColors[colorIndex];
    colorIndex++;

    if (colorIndex >= shuffledFrameColors.length) {
      shuffleFrameColors();
      colorIndex = 0;
    }

    fakeFrames.push({
      x: fx,
      y: fy,
      color: color,
      ...(getIllusionRound() === 10 ? { h: frameH } : {})
    });
  }

function createLandingEffect(x, y) {
  landingEffects.push({
    x: x + 0.5,
    y: y + 0.7,
    start: performance.now()
  });

  if (landingEffects.length > 12) {
    landingEffects.shift();
  }
}

function drawLandingEffects() {
  const now = performance.now();

  landingEffects = landingEffects.filter(effect =>
    now - effect.start < 260
  );

  landingEffects.forEach(effect => {
    const progress = (now - effect.start) / 260;
    const spread = progress * 0.48;

    ctx.save();
    ctx.globalAlpha = (1 - progress) * 0.65;
    ctx.strokeStyle = '#b9faff';
    ctx.lineWidth = 0.035;
    ctx.lineCap = 'round';

    // Flüssigkeit breitet sich seitlich aus
    ctx.beginPath();
    ctx.moveTo(effect.x - spread, effect.y);
    ctx.lineTo(effect.x + spread, effect.y);
    ctx.stroke();

    ctx.restore();
  });
}

function clearDiagonalSixByColor(){
  const toClear=[];

  function hasLetter(y, x) {
    return (
      arena[y][x] !== null ||
      illusion9RainArena[y][x] !== null
    );

  for(let y=arena.length-1;y>=0;y--){
    for(let x=0;x<arena[0].length;x++){

      if(!hasLetter(y,x)) continue;

      const baseColor = COLORS[(x+y)%COLORS.length];
      const chain=[[y,x]];

      let ny=y-1,nx=x+1;

      while(
        ny>=0 &&
        nx<arena[0].length &&
        hasLetter(ny,nx) &&
        COLORS[(nx+ny)%COLORS.length]===baseColor
      ){
        chain.push([ny,nx]);
        ny--; nx++;
      }

      if(chain.length>=4) {
        chain.forEach(p=>toClear.push(p));
      }
    }
  }

  if(!toClear.length) return;

  const uniqueToClear = [
    ...new Map(
      toClear.map(([y,x])=>[`${y},${x}`,[y,x]])
    ).values()
  ];

  uniqueToClear.forEach(([y,x])=>{

function createIllusion9DropGroup() {

function illusion9FrameFloorAt(x, y) {

  if (
    !framesInvisible &&
    x === frameX &&
    y === frameY + frameH
  ) return true;

  return fakeFrames.some((f, index) => {

    const visible =
      !framesInvisible ||
      (
        getIllusionRound() === 6 &&
        (
          (illusion6FakeVisible && index === illusion6FakeIndex) ||
          (illusion6BlinkVisible && index === illusion6BlinkIndex)
        )
      );

      y === f.y + h
    );
  });
}


function updateIllusion9Drops(delta) {
  for (let i = illusion9Drops.length - 1; i >= 0; i--) {
    const letter = illusion9Drops[i];

    letter.y += letter.speed * delta;

    const nextY = Math.floor(letter.y + 1);

    const hitBottom = nextY >= arena.length;

    const hitLetter =
      nextY >= 0 &&
      nextY < arena.length &&
      (
        arena[nextY][letter.x] !== null ||
        illusion9RainArena[nextY][letter.x] !== null
      );

    const hitFrame =
      nextY >= 0 &&
      nextY < arena.length &&
      illusion9FrameFloorAt(letter.x, nextY);

    if (hitBottom || hitLetter || hitFrame) {

      let landY = Math.min(arena.length - 1, nextY - 1);

      // Freies Feld oberhalb suchen
      while (
        landY >= 0 &&
        (
          arena[landY][letter.x] !== null ||
          illusion9RainArena[landY][letter.x] !== null
        )
      ) {
        landY--;

        rubberImpact(letter.x, landY);

  }

  draw();
  requestAnimationFrame(update);

function pauseGame() {

  if (!gameRunning || gamePaused) return;

  gamePaused = true;
  document.body.classList.add('game-paused');
  gameRunning = false;

  pauseStartedAt = Date.now();

  pauseManagedTimers();

  updateStartPauseButton();
}

function resumeGame() {

  if (!gamePaused) return;

  const pauseDuration = Date.now() - pauseStartedAt;

  // THE ECHO: Blink-Zeit einfrieren
  if (illusion3EchoBlinkIndex !== -1 &&
      illusion3EchoBlinkStart > 0) {

    illusion3EchoBlinkStart += pauseDuration;
  }

  gamePaused = false;
  document.body.classList.remove('game-paused');
  gameRunning = true;

  resumeManagedTimers();

  updateStartPauseButton();
}

function startGame() {

  initAudio();

  // Laufendes Spiel pausieren
  if (gameRunning) {
    pauseGame();
    return;
  }

  // Pausiertes Spiel fortsetzen
  if (gamePaused) {
    resumeGame();
    return;
  }

  if (window.introTextAnim) {
    cancelAnimationFrame(window.introTextAnim);
    window.introTextAnim = null;
  }

  document.getElementById('introPreviewOverlay')?.remove();

  if (window.previewAnim) {
    cancelAnimationFrame(window.previewAnim);
    window.previewAnim = null;
  }

  wrongLimitTriggered = false;
  wrongCount = 0;

  updateWrongPoints();

  shuffleIllusions();
  shuffleWords();
  shuffleFrameColors();

  colorIndex = 0;
  round = 1;

  prepareOpticalHintSchedule();
  
  illusion7HintLetterUsed = false;
  illusion8HintLetterUsed = false;
  
  gamePaused = false;
  gameRunning = true;
  gameHasStarted = true;
  
  resetPlayer();
  newTargetWord();
  
  updateRoundDisplay();

  updateStartPauseButton();
}


function restartGame() {
   
  if (!gameHasStarted) return;
   
     document.body.classList.remove('game-paused');
  
  if (gamePaused) {
    gamePaused = false;
    resumeManagedTimers();
  }
  initAudio();
  
  wrongCount = 0;
  updateWrongPoints();
  
  resetRound5Void();

  round = 1;
  
  prepareOpticalHintSchedule();
  
  illusion7HintLetterUsed = false;
  illusion8HintLetterUsed = false;
  
  frameColor = originalFrameColors[0];
  mindMessageShown = false;
  framesInvisible = false;
  resetIllusion6Fake();
  hintDisabled = false;
  hintRevealed = false;
  pulseActive = false;
  fakePulseActive = false;
  fakePulseTriggered = false;
  round4InvisibleY = null;

  if (revealTimeout) clearTimeout(revealTimeout);
  if (colorShiftTimeout) clearTimeout(colorShiftTimeout);
  if (fakePulseTimeout) clearTimeout(fakePulseTimeout);

  arena.forEach(r => r.fill(null));
  illusion9RainArena.forEach(row => row.fill(null));
  illusion9Drops = [];
  illusion4LetterColors.forEach(row => row.fill(null));
  i10Flipped.forEach(row => row.fill(false));
  clearHighlights();
  shuffleIllusions();
  shuffleWords();
  shuffleFrameColors();
  colorIndex = 0;

  newTargetWord();
  generateFakeFrames();
  resetPlayer();
  
  
  dropCounter = 0;
  gameRunning = true;
  gamePaused = false;
  updateStartPauseButton();
  
  frameColor = originalFrameColors[round - 1];
  updateRoundDisplay();
}

function dropFast() {

  if (!gameRunning || illusion7TrapTriggered) return;

  if (getIllusionRound() === 9) {

    createIllusion9DropGroup();

    return;

  }

  while (!collide(arena, player)) {

    updateFrameFloorContact();
    player.pos.y++;

    // SENSOR BEI JEDEM FALLSCHRITT
    if (detectIllusion7FirstLetter()) {
      checkAndClearWords();
      return;
    }
  }

  player.pos.y--;

  if (detectIllusion7FirstLetter()) {
    checkAndClearWords();
    return;
  }

  merge(arena, player);
  checkAndClearWords();
  clearDiagonalSixByColor();
  resetPlayer();
}
